<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Digital Evangelization Network</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="bg-[#f0f4f9] min-h-screen flex flex-col justify-between font-sans antialiased text-gray-800">

    <!-- TOP BLUE HEADER BAR -->
    <header class="bg-[#2563eb] text-white py-3 px-6 shadow-sm">
      <h1 class="text-lg font-bold tracking-wide">Admin Login</h1>
    </header>

    <!-- MAIN CENTER CONTAINER -->
    <main class="flex-1 flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-[420px] rounded-2xl shadow-xl overflow-hidden relative border border-gray-100">
        
        <!-- TOP GRADIENT ACCENT BAR -->
        <div class="h-1.5 w-full bg-gradient-to-r from-[#2563eb] via-[#059669] to-[#10b981]"></div>

        <div class="p-8 space-y-6">
          <!-- BRAND LOGO & HEADER -->
          <div class="text-center space-y-3">
            <img src="logo2.png" alt="Digital Evangelization Network" class="h-16 mx-auto object-contain" />
            <h2 class="text-xl font-bold text-[#2563eb]">Admin Portal</h2>
            <p class="text-xs text-gray-500 font-medium">Staff access only. Please enter your credentials below.</p>
          </div>

          <!-- LOGIN FORM -->
          <form id="login-form" class="space-y-4">
            
            <!-- USERNAME FIELD -->
            <div>
              <label for="username" class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider mb-1.5">USERNAME</label>
              <input 
                type="text" 
                id="username" 
                placeholder="Enter admin username" 
                required 
                class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
              />
            </div>

            <!-- PASSWORD FIELD WITH EYE TOGGLE -->
            <div>
              <label for="password" class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider mb-1.5">PASSWORD</label>
              <div class="relative">
                <input 
                  type="password" 
                  id="password" 
                  placeholder="••••••••" 
                  required 
                  class="w-full px-3.5 py-2.5 pr-10 rounded-lg border border-gray-300 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                />
                <button 
                  type="button" 
                  id="toggle-password" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none text-sm">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- SIGN IN BUTTON -->
            <button 
              type="submit" 
              class="w-full bg-[#2563eb] hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200 text-sm flex items-center justify-center space-x-2 mt-2">
              <i class="fa-solid fa-key text-amber-300 text-xs"></i>
              <span>Sign In</span>
            </button>
          </form>

          <!-- FOOTER NOTICE INSIDE CARD -->
          <div class="pt-4 border-t border-gray-100 text-center text-[11px] text-gray-400 space-y-0.5">
            <div>Unauthorized access is strictly prohibited.</div>
            <div class="font-semibold text-gray-500">Digital Evangelization Network Philippines</div>
          </div>
        </div>

      </div>
    </main>

    <!-- PAGE FOOTER COPYRIGHT -->
    <footer class="py-4 text-center text-xs text-gray-400">
      © 2026 Digital Evangelization Network • All rights reserved
    </footer>

    <!-- Custom JavaScript -->
    <script src="admin.js"></script>
  </body>
</html>
